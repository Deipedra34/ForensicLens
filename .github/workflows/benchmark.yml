name: Benchmark

# Keeps the benchmark table in README.md current. Deliberately not run on
# pull requests: benchmark numbers on shared CI runners are noisy enough
# that this should be an explicit or main-branch-only action, not a PR
# gate. See scripts/benchmark/run.sh and scripts/benchmark/update-readme.sh.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "scripts/benchmark/**"

permissions:
  contents: write

jobs:
  update-benchmark-table:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No swift-version pin: swift-actions/setup-swift installs the latest
      # available toolchain, which is always >= this package's minimum
      # (swift-tools-version:5.9 in Package.swift, which is a floor, not an
      # exact version). Pinning to 5.9 broke this job once ubuntu-latest
      # moved to a newer Ubuntu than Swift 5.9 has an official build for
      # (HTTP 404 fetching the toolchain); tracking "latest" avoids that
      # class of failure recurring as the runner image ages.
      #
      # skip-verify-signature works around a currently-open upstream bug
      # (swift-actions/setup-swift#798) where GPG verification of the
      # downloaded toolchain fails with "No public key" for every version,
      # unrelated to this project. The toolchain is still fetched over
      # HTTPS from swift.org; this only skips the extra GPG check on top
      # of that. Safe to drop once #798 is fixed upstream.
      - name: Set up Swift toolchain
        uses: swift-actions/setup-swift@v3
        with:
          skip-verify-signature: true

      - name: Build project
        run: swift build -c release

      - name: Run benchmark
        run: scripts/benchmark/run.sh --json benchmark-results.json

      - name: Update README benchmark table
        run: scripts/benchmark/update-readme.sh --input benchmark-results.json

      - name: Remove benchmark JSON scratch file
        run: rm -f benchmark-results.json

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No benchmark changes; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update benchmark results in README"
          git push
