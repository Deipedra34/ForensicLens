name: Benchmark

# Keeps the benchmark table in README.md current. Deliberately not run on
# pull requests: benchmark numbers on shared CI runners are noisy enough
# that this should be an explicit or main-branch-only action, not a PR
# gate. See scripts/benchmark/run.sh and scripts/benchmark/update-readme.sh.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "scripts/benchmark/**"

permissions:
  contents: write

jobs:
  update-benchmark-table:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to 6.3.3 (rather than tracking "latest") to work around a
      # currently-open upstream bug (swift-actions/setup-swift#802): the
      # bundled swiftly 1.1.0 mis-builds the download URL for any toolchain
      # version ending in ".0" (drops the trailing zero), so "latest"
      # started failing the moment Swift 6.4.0 was released. 6.3.3 is the
      # newest release that doesn't end in ".0" and isn't affected. Safe to
      # go back to tracking "latest" once #802 (or an equivalent swiftly
      # bump) merges upstream -- see that same class of failure's other
      # side documented in the 5.9-pin note this replaced: don't pin to a
      # version so old that a future Ubuntu image drops official support
      # for it either.
      #
      # skip-verify-signature works around a separate, also still-open
      # upstream bug (swift-actions/setup-swift#798) where GPG verification
      # of the downloaded toolchain fails with "No public key" for every
      # version, unrelated to this project. The toolchain is still fetched
      # over HTTPS from swift.org; this only skips the extra GPG check on
      # top of that. Safe to drop once #798 is fixed upstream.
      - name: Set up Swift toolchain
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
          skip-verify-signature: true

      - name: Build project
        run: swift build -c release

      - name: Run benchmark
        run: scripts/benchmark/run.sh --json benchmark-results.json

      - name: Update README benchmark table
        run: scripts/benchmark/update-readme.sh --input benchmark-results.json

      - name: Remove benchmark JSON scratch file
        run: rm -f benchmark-results.json

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No benchmark changes; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update benchmark results in README"
          git push
