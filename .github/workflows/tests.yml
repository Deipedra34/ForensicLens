name: Tests

# Runs the test suite on every push and pull request, across macOS and
# Linux. Unlike benchmark.yml (which only tracks performance on main and
# is deliberately not a PR gate), this workflow exists specifically to
# catch regressions before merge.
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # macOS runners ship Xcode's own Swift toolchain, which already
      # satisfies this package's swift-tools-version:5.9 floor, so there's
      # nothing to install there. Linux runners don't ship Swift at all.
      #
      # Pinned to 6.3.3 (rather than tracking "latest") to work around a
      # currently-open upstream bug (swift-actions/setup-swift#802): the
      # bundled swiftly 1.1.0 mis-builds the download URL for any toolchain
      # version ending in ".0" (drops the trailing zero), so "latest"
      # started failing the moment Swift 6.4.0 was released. 6.3.3 is the
      # newest release that doesn't end in ".0" and isn't affected. Safe to
      # go back to tracking "latest" once #802 (or an equivalent swiftly
      # bump) merges upstream; see benchmark.yml's copy of this note for
      # the full reasoning, including why not to pin to something old
      # instead.
      #
      # skip-verify-signature works around a separate, also still-open
      # upstream bug (swift-actions/setup-swift#798) where GPG verification
      # of the downloaded toolchain fails with "No public key", unrelated to
      # this project. The toolchain is still fetched over HTTPS from
      # swift.org; this only skips the extra GPG check on top of that.
      - name: Set up Swift toolchain (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
          skip-verify-signature: true

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: swift test

      # Coverage is only collected on Linux: one report per push/PR is
      # enough for Codecov, and this keeps the macOS job as close as
      # possible to what a contributor runs locally.
      - name: Run tests with code coverage (Linux)
        if: runner.os == 'Linux'
        run: swift test --enable-code-coverage

      # --- Coverage extraction (Linux only) ---
      #
      # `swift test --enable-code-coverage` leaves raw profiling data under
      # .build/debug/codecov/*.profraw, one file per test executor. Before
      # llvm-cov can read it, the raw profiles need merging into a single
      # .profdata file.
      #
      # setup-swift installs the toolchain through swiftly. `swift` itself
      # stays on PATH for the rest of the job, but empirically (confirmed by
      # tracing a failed run) neither the `swiftly` command, a directory
      # containing bare `llvm-profdata`/`llvm-cov`, nor the SWIFTLY_HOME_DIR
      # environment variable setup-swift is supposed to export reliably
      # survive into this step -- so this doesn't trust PATH, `swiftly`, or
      # any single guessed directory for any of it. It searches the entire
      # filesystem for the real binary instead, which costs a few seconds
      # but is guaranteed correct regardless of exactly where this
      # particular runner image or setup-swift version happened to put it.
      - name: Merge raw coverage profiles
        if: runner.os == 'Linux'
        run: |
          LLVM_PROFDATA="$(find / -xdev -name llvm-profdata -type f 2>/dev/null | head -1)"
          if [ -z "$LLVM_PROFDATA" ]; then
            echo "::error::could not locate llvm-profdata anywhere on the filesystem"
            exit 1
          fi
          echo "Using $LLVM_PROFDATA"
          "$LLVM_PROFDATA" merge -sparse \
            .build/debug/codecov/*.profraw \
            -o .build/debug/codecov/default.profdata

      # Exports the merged profile as an lcov report (the format Codecov
      # and most coverage tooling expect), pointing llvm-cov at the
      # compiled test bundle so it can map coverage counters back to
      # source lines. The bundle name matches this package's name
      # ("forensiclens" in Package.swift) with "PackageTests.xctest"
      # appended, which is SwiftPM's standard naming for it on Linux. See
      # the previous step's comment for why this is looked up by searching
      # the filesystem rather than trusting PATH or `swiftly`.
      - name: Export lcov coverage report
        if: runner.os == 'Linux'
        run: |
          LLVM_COV="$(find / -xdev -name llvm-cov -type f 2>/dev/null | head -1)"
          if [ -z "$LLVM_COV" ]; then
            echo "::error::could not locate llvm-cov anywhere on the filesystem"
            exit 1
          fi
          echo "Using $LLVM_COV"
          "$LLVM_COV" export -format="lcov" \
            .build/debug/forensiclensPackageTests.xctest \
            -instr-profile .build/debug/codecov/default.profdata \
            > coverage.lcov

      - name: Upload coverage report artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov

      # Tokenless upload never got Codecov to actually record a report for
      # this repo (the action step succeeded, but the repo stayed
      # unrecognized on Codecov's end), so this now authenticates with the
      # CODECOV_TOKEN repo secret from https://codecov.io/gh/Deipedra34/ForensicLens.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: false
